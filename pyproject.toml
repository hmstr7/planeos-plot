[project]
name = "planeos-plot"
version = "0.1.0"
description = "Plot recorded flight data."
readme = "README.md"
authors = [
    { name = "hmstr7", email = "nvlad1491@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "pyside6>=6.12.0",
]

[project.scripts]
planeos-plot = "planeos_plot:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
